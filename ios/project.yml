name: Stubly
options:
  bundleIdPrefix: com.omeraydemir
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: tr
  createIntermediateGroups: true

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  StublyKit:
    path: Packages/StublyKit

targets:
  Stubly:
    type: application
    platform: iOS
    sources:
      - path: Stubly
      - path: Shared
    info:
      path: Support/Info.plist
      properties:
        CKSharingSupported: true
        UIBackgroundModes:
          - remote-notification
        CFBundleURLTypes:
          - CFBundleURLName: com.omeraydemir.stubly
            CFBundleURLSchemes:
              - stubly
        StublyServerHost: $(STUBLY_SERVER_HOST)
        StublyServerKey: $(STUBLY_SERVER_KEY)
        # Wallet'taki kart (••• → Paylaş), Dosyalar ya da Mail'deki PDF "Stubly ile aç" ile içe aktarılır.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Wallet Pass
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.apple.pkpass
          - CFBundleTypeName: PDF
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
        LSSupportsOpeningDocumentsInPlace: false
        # Wallet biniş kartları (.pkpass) içe aktarılabilsin; Wallet'ı olmayan ortamda da tür tanınsın.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.apple.pkpass
            UTTypeDescription: Wallet Pass
            UTTypeConformsTo:
              - public.data
              - public.content
            UTTypeTagSpecification:
              public.filename-extension:
                - pkpass
              public.mime-type:
                - application/vnd.apple.pkpass
    entitlements:
      path: Support/Stubly.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.omeraydemir.stubly
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
        com.apple.security.application-groups:
          - group.com.omeraydemir.stubly
    dependencies:
      - package: StublyKit
      - target: StublyWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omeraydemir.stubly
        DEVELOPMENT_TEAM: 4BAD86T55H
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: Stubly
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Stubly
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Harcama makbuzlarının ve belgelerin fotoğrafını çekmek için kamerayı kullanır."
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Seyahatin uçuşlarını, otel giriş ve çıkışlarını ve saatli duraklarını Takvim'deki Stubly takvimine ekler; tekrar aktarınca günceller."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Seyahat tarihlerindeki fotoğraflarını anlara ayırıp haritada göstermek için fotoğraf arşivini okur; fotoğraflar cihazdan çıkmaz."
        DEVELOPMENT_LANGUAGE: tr
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES

  StublyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    info:
      path: Support/Widgets-Info.plist
      properties:
        CFBundleDisplayName: Stubly
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Support/Widgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.omeraydemir.stubly
    dependencies:
      - package: StublyKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omeraydemir.stubly.widgets
        DEVELOPMENT_TEAM: 4BAD86T55H
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: StublyWidgets
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

schemes:
  Stubly:
    build:
      targets:
        Stubly: all
    run:
      config: Debug
    archive:
      config: Release
